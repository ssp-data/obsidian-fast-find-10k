# Golden queries against fixtures/vault (spec §12).
# A name matches a hit when it equals the hit's title or the hit's path ends with it.
# expect_in_top = within the first 5 hits; expect_similar_count = exact, hit anywhere in the page;
# must_not_appear = not anywhere in the returned page; expect_in_top3 = within the first 3 hits;
# expect_tier = the tier every hit named in expect_top / expect_in_top / expect_in_top3 must have.

[[case]]
query = "obsidian trouble"
expect_top = "Obsidian Troubleshooting"

[[case]]
query = "obsidian troubleshoot"
expect_top = "Obsidian Troubleshooting"

[[case]]
query = "obsidian troubelshoot"
expect_top = "Obsidian Troubleshooting"
expect_similar_count = { "Neovim Troubleshooting" = 0 }

[[case]]
query = "AI"
must_not_top3 = ["Airflow Basics", "aim high", "Airflow for Data Engineering"]
expect_in_top = ["AI in Data Engineering", "Data Engineering with AI", "AI for Data Engineers"]

# Top pick rests on the backlink hub bonus and the H1: "AI in Data Engineering" ties "Data Engineering
# with AI" on title coverage, has an H1 (105 per term vs 100 for a title-only note) and 5 backlinks.
[[case]]
query = "data engineering ai"
expect_top = "AI in Data Engineering"
expect_in_top = ["AI in Data Engineering", "Data Engineering with AI", "AI for Data Engineers"]
must_not_top3 = ["👉🏻 Data Engineering", "RW Pandas AI — The Future of Data Analysis"]

# Prefix quality: `engineer`->`engineers` (8/9) outscores `engineer`->`engineering` (8/11); spec §16 ruling.
# Both notes carry an H1 equal to their title (as most notes do), so the H1 weight does not decide.
[[case]]
query = "data engineer ai"
expect_top = "AI for Data Engineers"
expect_in_top = ["AI in Data Engineering", "Data Engineering with AI", "AI for Data Engineers"]
must_not_top3 = ["👉🏻 Data Engineering", "RW Pandas AI — The Future of Data Analysis"]

# Same backlink-bonus tie-break as "data engineering ai" (328.6 vs 325.0).
[[case]]
query = "ai data engineering"
expect_top = "AI in Data Engineering"
expect_in_top = ["AI in Data Engineering", "Data Engineering with AI", "AI for Data Engineers"]

[[case]]
query = "mlops data engineering"
expect_in_top = ["RW MLOps is mostly data engineering", "RW MLOps Is Mostly Data Engineering."]
expect_similar_count = { "RW MLOps is mostly data engineering" = 1, "RW MLOps Is Mostly Data Engineering." = 1 }

[[case]]
query = "rust data eng"
expect_in_top = ["RW Rust for Data Engineering", "RW Rust for Data Engineering  Dataengineering"]
expect_similar_count = { "RW Rust for Data Engineering" = 1, "RW Rust for Data Engineering  Dataengineering" = 1 }

[[case]]
query = "llm pipelines"
expect_top = "LLMs for Pipelines"

[[case]]
query = "ai data engineer"
mode = "files"
expect_in_top = ["LLMs for Pipelines", "AI Data Engineer Workflows"]

[[case]]
query = "obsidian search lots"
# The file name has U+00A0 between "Obsidian" and "Search".
expect_top = "Obsidian\u00A0Search (lots of files)"

[[case]]
query = "painful repetitive job"
expect_in_top = [
  "RW The Most Painful and Repetitive Job of a Data Engineer",
  "RW The Most Painful and Repetitive Job of a Data Engineer-2",
]
expect_similar_count = { "RW The Most Painful and Repetitive Job of a Data Engineer" = 1, "RW The Most Painful and Repetitive Job of a Data Engineer-2" = 1 }

[[case]]
query = "index"
expect_in_top = ["💡 Resources/Index.md", "Archive/Index.md"]

[[case]]
query = "data mesh"
expect_top = "Data Mesh"
must_not_top3 = ["Data Platform Engineering"]

[[case]]
query = '"data engineering"'
must_not_top3 = ["Data Platform Engineering"]

# Daily notes (YYYY-MM-DD) are not copies of each other.
[[case]]
query = "2026-07-01"
expect_top = "2026-07-01"
expect_similar_count = { "2026-07-01" = 0 }

# Fully covered short title beats the long title containing the same words (spec §6.4 structural).
[[case]]
query = "data engineering"
# The long title (5 unmatched words, factor floor 0.5) lands 9th here, so no expect_in_top for it.
expect_top = "👉🏻 Data Engineering"

# The long title wins once its distinctive word is typed.
[[case]]
query = "fundamentals data engineering"
expect_top = "Fundamentals of Data Engineering (Joe Reis, Matt Housley)"

# Fuzzy needs the matched needle chars (>= needle chars - typo budget) and ratio >= 0.65:
# substitution-heavy alignments ("writing" ~ "checkpointing"/"everything", "should" ~
# "prescheduled") are rejected. None of the decoys contains "writing" or "should".
[[case]]
query = "ai writing"
must_not_appear = ["Airbyte Checkpointing", "Don't use AI for everything, you stop thinking-learning AI Use"]

# `i` is an optional term (default list `a an the of to in on i`): never required, scored when it hits;
# "Change Should Happen" has no `i` and still shows. It ranks first (fields 200 x title factor 0.85 =
# 170 vs 300 x floor 0.5 = 150: four unmatched title words), so no expect_top here (task 23 review).
[[case]]
query = "should i change"
expect_in_top = ["Should I Change My Writing because of AI", "Change Should Happen"]
must_not_appear = ["Social Media Prescheduled Long Format"]

# Fuzzy title match must not depend on later title words: frizbee's best alignment of `obsidain`
# borrows the `i`/`n` of "troubleshooting" (0 typos, span too wide) and was rejected, dropping the
# title to tier 4; the retry over per-token windows finds the local 1-typo alignment (final review).
[[case]]
query = "obsidain troubleshooting"
expect_top = "Obsidian Troubleshooting"
expect_tier = 1

# The fixture title has a no-break space after "Obsidian".
[[case]]
query = "obsidina search"
expect_in_top3 = ["Obsidian\u00A0Search (lots of files)"]
expect_tier = 1

# ---- docs/recall.md fixes (owner-approved 2026-10-27) ----

# Fix 1: `#115` is a word when no note carries that tag.
[[case]]
query = "newsletter #115"
expect_top = "Newsletter #115"
expect_tier = 1

# Fix 1: `-Marktleistung` is a word when excluding it leaves no full hit.
[[case]]
query = "KW13 -Marktleistung"
expect_top = "KW13 -Marktleistung"
expect_tier = 1

# Fix 2: dotted compounds; `ai` alone never satisfies `jasper.ai`.
[[case]]
query = "jasper.ai"
expect_top = "Jasper.ai"
must_not_appear = ["AI in Data Engineering", "Data Engineering with AI", "AI for Data Engineers", "👉🏻 Data Engineering"]

# Fix 3: five typed letters, one typo, title only.
[[case]]
query = "gitub"
expect_top = "GitHub"
expect_tier = 1

# Fix 4: the title equal to the whole query beats compound titles with backlinks (DataOps has 5).
[[case]]
query = "data"
expect_top = "data"
expect_in_top = ["DataOps"]

# Exact/prefix hits sort above fuzzy hits within a tier (owner ruling 2026-10-27). "Brand Voice"
# (`n` + `voice`) is not a typo of `invoice` at all: a fuzzy alignment may span words only when
# each touched word carries 3+ matched letters.
[[case]]
query = "invoice"
expect_top = "Sales Invoice Process and Cashflow Notes"
expect_tier = 1
must_not_appear = ["Brand Voice"]

# ---- frontmatter properties (v1.1) ----

# Property values are content-tier hits: `india` lives only in the frontmatter of KAFOJ Espresso.
[[case]]
query = "india espresso"
expect_top = "KAFOJ Espresso"
expect_tier = 3

# `[key:value]` filters like `#tag`.
[[case]]
query = "[herkunftsland:india]"
expect_top = "KAFOJ Espresso"
must_not_appear = ["Adrianos Espresso"]

[[case]]
query = "[price] espresso"
expect_in_top = ["KAFOJ Espresso", "Adrianos Espresso"]

# Obsidian Bases are indexed: title from the file name, YAML text as body.
[[case]]
query = "coffee beans base"
expect_top = "Coffee Beans Base"
expect_tier = 1

# Canvas files are indexed as markdown: group labels as headings, text nodes as content.
[[case]]
query = "book plan"
expect_top = "Book Plan"
expect_tier = 1

[[case]]
query = "zettelkasten workflows folders"
expect_top = "Book Plan"

# `type:` keeps one file kind.
[[case]]
query = "type:base coffee"
expect_top = "Coffee Beans Base"
must_not_appear = ["KAFOJ Espresso", "Adrianos Espresso"]

[[case]]
query = "type:canvas plan"
expect_top = "Book Plan"
